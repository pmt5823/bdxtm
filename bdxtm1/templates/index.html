<!DOCTYPE html>
<html>
<head>
    <title>Bãi đỗ xe thông minh</title>
    <meta charset="UTF-8">

    <style>
        body{
            font-family: Arial;
            text-align:center;
            background:#f4f6f8;
        }

        h1{
            color:#2c3e50;
        }

        table{
            margin:auto;
            border-collapse: collapse;
            width:80%;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
            font-size:18px;
        }

        th{
            background:#3498db;
            color:white;
        }

        tr:nth-child(even){
            background:#f2f2f2;
        }

        button{
            padding:12px 20px;
            font-size:18px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            margin:10px;
        }

        .in{
            background:#2ecc71;
            color:white;
        }

        .out{
            background:#e74c3c;
            color:white;
        }

        .box{
            background:white;
            padding:20px;
            width:85%;
            margin:auto;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

    <h1>🚗 HỆ THỐNG BÃI ĐỖ XE THÔNG MINH</h1>

    <div class="box">

        <!-- NÚT CAMERA -->
        <a href="/car_in_camera">
            <button class="in">📷 Xe vào (Camera)</button>
        </a>

        <a href="/car_out_camera">
            <button class="out">📷 Xe ra (Camera)</button>
        </a>

        <h2>Danh sách xe đang gửi</h2>

        <table>
            <tr>
                <th>Biển số</th>
                <th>Thời gian vào</th>
            </tr>

            {% for car in cars %}
            <tr>
                <td>{{ car[1] }}</td>
                <td>{{ car[2] }}</td>
            </tr>
            {% endfor %}

        </table>

    </div>

</body>
</html>
