<!DOCTYPE html>
<html>
<head>
    <title>Parking Manager</title>
    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
            text-align:center;
        }
        table{
            margin:auto;
            border-collapse:collapse;
            width:60%;
            background:white;
        }
        th,td{
            border:1px solid #ddd;
            padding:12px;
        }
        th{
            background:#4CAF50;
            color:white;
        }
        h1{
            color:#333;
        }
    </style>
</head>

<body>
    <h1>🚗 DANH SÁCH XE ĐANG GỬI</h1>

    <table>
        <tr>
            <th>Biển số</th>
            <th>Thời gian vào</th>
            <th>Trạng thái</th>
        </tr>

        {% for car in cars %}
        <tr>
            <td>{{ car.plate }}</td>
            <td>{{ car.time_in }}</td>
            <td>Đang gửi</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
